<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Amos’s School Week</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef5fb;color:#172b45;font:1rem/1.55 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:clamp(16px,4vw,48px)}header{background:#173b60;color:white;padding:clamp(20px,5vw,46px);border-radius:24px}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;margin:0 0 12px}p{margin:.5em 0}a{color:inherit}button,input,textarea{font:inherit}button,.link{display:inline-block;border:0;border-radius:10px;padding:10px 15px;background:#dff6e5;color:#133922;font-weight:750;cursor:pointer}.link{margin-top:12px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d77800;outline-offset:3px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin:22px 0 14px}.toolbar button{background:#dce9fa;color:#183655}.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}article,aside{background:white;border:1px solid #c9d9e8;border-radius:16px;padding:18px}article{border-top:5px solid #217c7b}article:nth-child(2n){border-top-color:#6357aa}h2,h3{margin:0}small{font-size:.9rem;color:#445d71}label.task{display:flex;align-items:center;gap:12px;min-height:48px;padding:7px 0;border-top:1px solid #e2ebf1;cursor:pointer}label.task:first-of-type{margin-top:10px}input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:#17736c;margin:0}label:has(input:checked) span{text-decoration:line-through;color:#496676}aside{margin-top:18px;border-left:5px solid #217c7b;background:#f5fcf8}blockquote{margin:0;font-size:1.15rem;font-weight:700}dialog{width:min(94vw,620px);max-height:90vh;border:1px solid #b2c5d8;border-radius:16px;color:inherit;padding:22px}dialog::backdrop{background:#132a4580}dialog label{display:block;margin:12px 0}textarea{display:block;width:100%;resize:vertical}output{font-weight:700}
</style>
<main><header><h1>Amos’s School Week</h1><p id="dates"></p><a class="link" href="https://miacademy.co/" target="_blank" rel="noopener">Open MiAcademy</a><p>Start with the next lesson on your dashboard for each subject.</p></header>
<div class="toolbar"><output id="progress" aria-live="polite"></output><div><label for="weeks">Week</label> <select id="weeks"></select> <button id="edit" type="button">Edit week</button> <button id="add" type="button">New week</button></div></div>
<p id="storageNotice" hidden>Browser storage is unavailable. Changes will last until this page closes.</p>
<section class="days" id="days" aria-label="Daily checklist"></section>
<aside><blockquote>“Big things get done one small step at a time.”</blockquote></aside>
<dialog id="editor"><form id="form"><h2 id="editorTitle"></h2><label>Monday’s date <input id="start" type="date" required></label><p>Enter one task per line. Leave a day empty for a day off.</p><div id="fields"></div><button type="submit">Save week</button> <button type="button" id="cancel">Cancel</button></form></dialog></main>
<script>
const weekdays=['Monday','Tuesday','Wednesday','Thursday','Friday'];
const initial='2026-11-23';
const originalMonday=['Math lesson','Language arts lesson','Read for 15 minutes'];
const originalTuesday=['Math lesson','Science lesson','Practice 5 spelling words'];
const originalWednesday=['Language arts lesson','Social studies lesson','Read for 15 minutes or help with Thanksgiving prep'];
const holiday=[["Language Arts · Asking and Answering Questions — Student PDF","Language Arts · Asking and Answering Questions — Video lesson","Language Arts · Asking and Answering Questions — Levels 1–2","Spelling · Sliding Vowels: OU — Quiz assessment","Reading Comprehension · “Fox” — Student PDF","Math · Subtraction to the Thousands — Level 2","Earth and Space Science · What’s the Scoop? Analyzing and Sharing Data — Level 3","Earth and Space Science · What’s the Scoop? Analyzing and Sharing Data — Level 4","Social Studies · Holidays and Celebrations — Video lesson","Social Studies · Holidays and Celebrations — Level 1","Social Studies · Holidays and Celebrations — Level 2","Typing · Intro to the Bottom Row: B, N, V, M — Levels 5–6"],["Language Arts · Asking and Answering Questions — Levels 3–4","Language Arts · Asking and Answering Questions — Level 5","Spelling · Sliding Vowels: OW — Student PDF","Reading Comprehension · “Fox” — Level 1","Math · Subtraction to the Thousands — Level 3","Math · Subtraction to the Thousands — Quiz assessment","Earth and Space Science · What’s the Scoop? Analyzing and Sharing Data — Quiz assessment","Social Studies · Holidays and Celebrations — Level 3","Typing · Adding C, X, Comma, and Period — Levels 1–2"],["Language Arts · Paraphrasing — Student PDF","Language Arts · Paraphrasing — Video lesson","Language Arts · Paraphrasing — Levels 1–2","Spelling · Sliding Vowels: OW — Level 1","Reading Comprehension · “Fox” — Quiz assessment","Math · Addition and Subtraction to the Thousands Practice — Student PDF","Math · Addition and Subtraction to the Thousands Practice — Video lesson","Math · Addition and Subtraction to the Thousands Practice — Levels 1–2","Earth and Space Science · Layers of the Earth — Student PDF","Earth and Space Science · Layers of the Earth — Video lesson","Earth and Space Science · Layers of the Earth — Level 1","Social Studies · Holidays and Celebrations — Level 4","Social Studies · Holidays and Celebrations — Quiz assessment","Typing · Adding C, X, Comma, and Period — Levels 5–6"],[],['Optional: Finish one lesson left over from the week. If you’re caught up, enjoy the day off!']];
const key='amos-school-weeks-v1';
const notice=document.querySelector('#storageNotice');
let state={selected:initial,weeks:{[initial]:{tasks:holiday,checked:[[],[],[],[],[]]}}};
try {const saved=localStorage.getItem(key);if(saved){state=JSON.parse(saved);const first=state.weeks[initial];if(first){[originalMonday,originalTuesday,originalWednesday].forEach((tasks,day)=>{if(JSON.stringify(first.tasks[day])===JSON.stringify(tasks)){first.tasks[day]=holiday[day];first.checked[day]=[]}});localStorage.setItem(key,JSON.stringify(state))}}} catch {notice.hidden=false}
const byId=id=>document.getElementById(id);
const make=(tag,value)=>{const node=document.createElement(tag);if(value!==undefined)node.textContent=value;return node};
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{notice.hidden=false}}
function dateAt(monday,index){const date=new Date(monday+'T12:00:00');date.setDate(date.getDate()+index);return date}
const shortDate=new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric'});
const fullDate=new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric'});
function updateProgress(week){
 const required=week.tasks.flatMap((tasks,day)=>tasks.flatMap((task,index)=>/^optional:/i.test(task)?[]:[!!week.checked[day][index]]));
 byId('progress').textContent=required.length?required.filter(Boolean).length+' of '+required.length+' tasks done':'No required tasks this week';
}
function render(){
 const monday=state.selected,week=state.weeks[monday],dates=byId('dates'),selector=byId('weeks'),days=byId('days');
 dates.textContent=shortDate.format(dateAt(monday,0))+' – '+fullDate.format(dateAt(monday,4));
 selector.replaceChildren(...Object.keys(state.weeks).sort().map(date=>new Option(fullDate.format(dateAt(date,0)),date,false,date===monday)));
 days.replaceChildren();
 weekdays.forEach((day,index)=>{
  const card=make('article');
  card.append(make('h2',day),make('small',shortDate.format(dateAt(monday,index))));
  if(!week.tasks[index].length)card.append(make('p',monday===initial&&index===3?'Thanksgiving break':'Day off'));
  week.tasks[index].forEach((task,taskIndex)=>{
   const label=make('label'),checkbox=make('input');
   label.className='task';checkbox.type='checkbox';checkbox.checked=!!week.checked[index][taskIndex];
   checkbox.addEventListener('change',()=>{week.checked[index][taskIndex]=checkbox.checked;save();updateProgress(week)});
   label.append(checkbox,make('span',task));card.append(label);
  });
  days.append(card);
 });
 updateProgress(week);
}
let editing=false;
function openEditor(edit){
 editing=edit;const start=byId('start'),week=state.weeks[state.selected];
 byId('editorTitle').textContent=edit?'Edit week':'New week';
 start.readOnly=edit;start.setCustomValidity('');
 const next=dateAt(state.selected,7);
 start.value=edit?state.selected:[next.getFullYear(),String(next.getMonth()+1).padStart(2,'0'),String(next.getDate()).padStart(2,'0')].join('-');
 const template=edit||state.selected!==initial?week.tasks:[originalMonday,originalTuesday,originalWednesday].concat([['Math lesson','Read for 15 minutes'],['Finish a lesson or review spelling']]);
 byId('fields').replaceChildren(...weekdays.map((day,index)=>{
  const label=make('label',day),field=make('textarea');
  field.rows=3;field.value=template[index].join('\n');label.append(field);return label;
 }));
 byId('editor').showModal();
}
byId('weeks').addEventListener('change',event=>{state.selected=event.target.value;save();render()});
byId('edit').onclick=()=>openEditor(true);
byId('add').onclick=()=>openEditor(false);
byId('cancel').onclick=()=>byId('editor').close();
byId('start').oninput=event=>event.target.setCustomValidity('');
byId('form').onsubmit=event=>{
 event.preventDefault();
 const start=byId('start'),date=start.value;
 if(dateAt(date,0).getDay()!==1||(!editing&&state.weeks[date])){
  start.setCustomValidity(dateAt(date,0).getDay()!==1?'Choose a Monday.':'That week already exists. Choose another Monday or edit it from the week list.');
  start.reportValidity();return;
 }
 const tasks=Array.from(byId('fields').querySelectorAll('textarea'),field=>field.value.split('\n').map(task=>task.trim()).filter(Boolean));
 const previous=editing?state.weeks[date]:null;
 const checked=tasks.map((day,index)=>day.map((task,position)=>!!(previous&&previous.tasks[index][position]===task&&previous.checked[index][position])));
 state.weeks[date]={tasks,checked};state.selected=date;save();render();byId('editor').close();
};
render();
</script></html>
